spring.application.name=account-service
spring.profiles.default=dev
server.port=${SERVER_PORT:28852}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}

server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-alias=${SSL_KEY_ALIAS:}

app.bootstrap-admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap-admin.name=${ADMIN_NAME:}
app.bootstrap-admin.lastname=${ADMIN_LASTNAME:}
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Secure account and payroll management REST API
info.app.version=0.0.1-SNAPSHOT
