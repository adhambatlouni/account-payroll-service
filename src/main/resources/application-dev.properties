spring.datasource.url=${DB_URL:jdbc:h2:file:./service_db;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

app.bootstrap-admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.bootstrap-admin.name=${ADMIN_NAME:Local}
app.bootstrap-admin.lastname=${ADMIN_LASTNAME:Administrator}
app.bootstrap-admin.email=${ADMIN_EMAIL:admin@acme.com}
app.bootstrap-admin.password=${ADMIN_PASSWORD:AdminPassword123}
