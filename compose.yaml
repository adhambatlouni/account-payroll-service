services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: account_service
      POSTGRES_USER: account_service
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - account-service-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_service -d account_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  application:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://database:5432/account_service
      DB_USERNAME: account_service
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_BOOTSTRAP_ENABLED: "true"
      ADMIN_NAME: ${ADMIN_NAME:-Portfolio}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@acme.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SSL_ENABLED: "false"
      ERROR_INCLUDE_MESSAGE: never
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  account-service-postgres:
